name: clawrouter-probe
on:
  workflow_dispatch:
  push:
    branches: ["lue/pmf4-review-clawrouter-access"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: One tiny request through ClawRouter behind Cloudflare Access
        env:
          CLAWROUTER_API_KEY: ${{ secrets.CLAWROUTER_API_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          code=$(curl -sS -o /tmp/r.json -w '%{http_code}' -X POST https://clawrouter.myhorizon.co.za/v1/messages \
            -H "x-api-key: $CLAWROUTER_API_KEY" -H "anthropic-version: 2023-06-01" \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            -H 'content-type: application/json' \
            -d '{"model":"anthropic/claude-opus-5-5","max_tokens":16,"messages":[{"role":"user","content":"Reply with exactly: READY"}]}')
          echo "provider=clawrouter endpoint=https://clawrouter.myhorizon.co.za key=pi_mono_review_ci status=$code"
          jq -c '{model, type, stop_reason, text: (.content[0].text // null), error: (.error.message // null)}' /tmp/r.json 2>/dev/null || head -c 300 /tmp/r.json
          [ "$code" = 200 ]
